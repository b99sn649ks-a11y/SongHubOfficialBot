<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SongHub</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>🎵 SongHub</h1>
<p>Создание песен на заказ</p>
</header>

<main>

<section class="hero">
<h2>Твоя песня — твоя история</h2>
<p>Создадим уникальную песню специально для тебя.</p>
<a href="#order" class="button">Заказать песню</a>
</section>

<section class="prices">
<h2>Наши цены</h2>

<div class="cards">

<div class="card">
<h3>Обычная песня</h3>
<p class="price">200 грн</p>
<p>Персональная песня по твоей истории.</p>
</div>

<div class="card">
<h3>Premium</h3>
<p class="price">500 грн</p>
<p>Расширенная персональная песня.</p>
</div>

</div>
</section>

<section id="order" class="order">
<h2>Заказать песню</h2>

<form>
<input type="text" placeholder="Твоё имя" required>

<input type="text" placeholder="Для кого песня?" required>

<textarea placeholder="Расскажи, о чём должна быть песня" required></textarea>

<button type="submit">Отправить заказ</button>
</form>
</section>

</main>

<footer>
<p>© 2026 SongHub</p>
</footer>

</body><script src="script.js"></script>
</html>
